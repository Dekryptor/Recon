# clang 19 targeting ELF on x86-64. It emits the same ABI as GCC — Itanium mangling, DWARF, the GNU
# linker, glibc — so it inherits the GCC base settings; what makes it clang is the evidence it leaves
# and the tool name.
#
# One trap: a clang-built binary on a GNU system carries *two* producer strings, because clang links
# against GCC's startup files. Its .comment says both "GCC: (Debian ...)" and "Debian clang version
# 19", so the rules below match clang and not the GCC string.
schema_version = 1
id = "clang-19-elf64"
display_name = "clang 19 (ELF, x86-64)"
family = "clang"
extends = "gcc-base"

[[targets]]
format = "elf64"
arch = "x64"

[abi]
mangling = "itanium"
default_cc = "sysv"
member_cc = "thiscall"
pointer_size = 8

[codegen]
function_align = 16
padding_bytes = [0x90, 0xCC]
prologue_hints = [
  "push rbp; mov rbp, rsp",
  "push rbx",
  "push r12",
  "sub rsp, imm",
  "endbr64",
]

[[detect.comment_section]]
contains = "clang version 19"

# The DWARF producer of a clang unit names the compiler the same way its .comment does.
[[detect.dwarf_producer]]
producer_contains = "clang version 19"

[[detect.import_dll]]
contains = "libc.so"

[compile]
exe = "clang"
default_flags = ["-c", "-g", "-O2"]
include_flag = "-I{path}"
define_flag = "-D{name}"
output_flag = "-o {obj}"

[link]
exe = "clang"
default_flags = []
